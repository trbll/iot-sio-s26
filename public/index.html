<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IoT Socket.IO Lab Starter</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      
      <h1>IoT Socket.IO In-Class Lab</h1>
      <p class="subtitle">Hello, World.</p>

      <section class="panel">
        <h2>Don't Press This Button</h2>
        <button id="button" onclick="buttonPushed()">Don't Press This Button</button>
      </section>

      <section class="panel">
        <h2>Mood Slider</h2>
        <input type="range" id="mood" min="0" max="100" value="50" onchange="moodChanged()" />
      </section>

      <section class="panel">
        <h2>Background Color</h2>
        <input type="color" id="colorSelector" onchange="colorChanged()" />
      </section>

    </main>

    <!-- Socket.IO client served by this Node server -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/script.js" defer></script>
  </body>
</html>
